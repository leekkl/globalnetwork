<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Site</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --primary-color: #24292e; /* GitHub dark grey */
            --accent-color: #0366d6;  /* GitHub link blue */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            background-color: #eaeaea;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Hyungoo Lee's Website</h1>
    </header>

    <main>
        <div class="card">
            <h2>Hello, World!</h2>
            <p>This site is successfully hosted using <strong>GitHub Pages</strong>.</p>
            <p>You can edit this <code>index.html</code> file to customize your profile, portfolio, or project documentation.</p>
            <a href="https://github.com" target="_blank">Visit GitHub</a>
        </div>
    </main>
    	<div class="interactive-container">
  			<iframe 
   			 src="ggiraph_plot.html" 
  			  width="100%" 
  			  height="600px" 
   			 loading="lazy"
  			  frameborder="0" 
   			 allowfullscreen>
 			 </iframe>
		</div>
	</main>
    <footer>
        <p>&copy; 2026 Your Name. Powered by GitHub Pages.</p>
    </footer>

</body>
</html>
